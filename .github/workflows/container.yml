# Builds the container on every push to main and publishes it to GitHub Packages:
#   docker run -p 7860:7860 ghcr.io/jayvarmes/soilsight:latest
name: Container image
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (must be lower case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/soilsight" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=SoilSight: soil grain size and soil type from phone photos
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name ss -p 7860:7860 ${{ steps.name.outputs.image }}:latest
          for i in $(seq 1 60); do curl -sf localhost:7860/api/health | grep -q '"ok":true' && break; sleep 2; done
          curl -sf localhost:7860/api/health
          curl -sf -o /dev/null localhost:7860/
